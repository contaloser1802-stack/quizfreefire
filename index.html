  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      font-family: 'Inter', sans-serif;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }

    .topbar .left {
      display: flex;
      align-items: center;
    }

    .topbar img.logo {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .topbar .text {
      font-size: 14px;
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .topbar .text .title {
      font-weight: bold;
      color: #111;
    }

    .topbar .text .subtitle {
      color: #e60000;
      font-size: 13px;
    }

    .topbar img.profile {
      width: 28px;
      height: 28px;
      border: 1px solid #ccc;
      border-radius: 50%;
      padding: 3px;
    }

    .card {
      background: #fff;
      width: 92%;
      max-width: 400px;
      margin: 20px auto;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.07);
      padding: 16px;
      text-align: center;
    }

    .card img.hero {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .card h2 {
      color: #f0a800;
      font-size: 18px;
      margin: 10px 0;
      line-height: 1.3;
    }

    .card p {
      font-size: 14px;
      color: #444;
      margin: 10px 0;
    }

    .card p span {
      color: #ff6600;
      font-weight: bold;
    }

    .note {
      font-size: 11px;
      color: #777;
      font-style: italic;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      margin-top: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      background: linear-gradient(to right, #ff3c00, #e63600);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.95;
    }

        <div class="subtitle">Recarga</div>
      </div>
    </div>
    <img src="https://cdn-icons-png.flaticon.com/512/747/747376.png" class="profile" alt="Perfil">
  </div>

  <div class="card">
    <img src="images/banner.png" alt="Quiz Premiado" class="hero">
    <h2>BEM-VINDO AO<br>QUIZ PREMIADO</h2>
    <p>
      Participe do nosso desafio e ganhe até <span>5600 diamantes</span> e itens raros.<br>
      Basta acertar o maior número de perguntas. Quanto mais acertos, maior o desconto!
    </p>
    <p class="note">*Prepare-se para o desafio e conquiste sua recompensa*</p>
    <form action="quiz.htm" method="get">
      <button type="submit">COMEÇAR DESAFIO</button>
    </form>
  </div>
